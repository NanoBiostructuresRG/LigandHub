<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma Dinámica</title>
</head>
<body>
    <h1>Calculadora de Suma</h1>
    
    <input type="number" id="numero1" placeholder="Primer número">
    <input type="number" id="numero2" placeholder="Segundo número">
    <br><br>
    <button onclick="sumar()">Sumar</button>
    
    <p id="resultado"></p>

    <script>
        function sumar() {
            let num1 = parseFloat(document.getElementById('numero1').value);
            let num2 = parseFloat(document.getElementById('numero2').value);
            let suma = num1 + num2;
            document.getElementById('resultado').innerHTML = "Resultado: " + suma;
        }
    </script>
</body>
</html>
